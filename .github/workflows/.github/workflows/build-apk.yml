name: 2 - Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "twa-manifest.json"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Point Bubblewrap to the pre-installed JDK/SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode signing key from secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > flowledger.keystore

      - name: Build signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bubblewrap build \
            --manifest="./twa-manifest.json" \
            --skipPwaValidation \
            --signingKeyPath="./flowledger.keystore" \
            --signingKeyAlias="${{ secrets.KEY_ALIAS }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flowledger-apk
          path: |
            app-release-signed.apk
            app-release-bundle.aab
          retention-days: 30

