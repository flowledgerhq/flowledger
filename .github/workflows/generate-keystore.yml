name: 1 - Generate Signing Key (run once)

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate random passwords
        id: pw
        run: |
          STORE_PW=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_PW=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          echo "store_pw=$STORE_PW" >> "$GITHUB_OUTPUT"
          echo "key_pw=$KEY_PW" >> "$GITHUB_OUTPUT"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore flowledger.keystore \
            -alias flowledger \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ steps.pw.outputs.store_pw }}" \
            -keypass "${{ steps.pw.outputs.key_pw }}" \
            -dname "CN=FlowLedger, OU=FlowLedger, O=FlowLedger, L=Istanbul, S=Istanbul, C=TR"

      - name: Encode keystore as base64
        run: base64 -w0 flowledger.keystore > flowledger.keystore.base64.txt

      - name: Write instructions with the values to save
        run: |
          cat > OKU_BENI.txt << EOF
          Bu 4 degeri GitHub reponda "Settings -> Secrets and variables -> Actions"
          sayfasindan "New repository secret" ile TEK TEK ekle:

          Secret adi: KEYSTORE_BASE64
          Degeri: flowledger.keystore.base64.txt dosyasinin TUM icerigi (tek satir, uzun bir metin)

          Secret adi: KEYSTORE_PASSWORD
          Degeri: ${{ steps.pw.outputs.store_pw }}

          Secret adi: KEY_ALIAS
          Degeri: flowledger

          Secret adi: KEY_PASSWORD
          Degeri: ${{ steps.pw.outputs.key_pw }}

          Bu 4 secret'i ekledikten sonra:
          1) Bu workflow run'ini (Actions sekmesi -> bu calisma) sil (silme butonu ile).
          2) "2 - Build APK" workflow'unu calistir.

          ONEMLI: Bu keystore dosyasini ve sifreleri KAYBETME.
          Ileride uygulamayi guncellemek icin (Play Store dahil) hep AYNI keystore gerekiyor.
          Kaybedersen, yayinlanmis uygulamayi bir daha guncelleyemezsin, yeniden yayinlaman gerekir.
          EOF

      - name: Upload as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowledger-signing-key-KAYBETME
          path: |
            flowledger.keystore.base64.txt
            OKU_BENI.txt
          retention-days: 1

