<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>FlowLedger — Ortak Kuyu Defteri</title>
<meta name="theme-color" content="#16302c">
<meta name="description" content="Ortak su kuyusu ve pompa sistemleri için adil elektrik paylaşım defteri.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --ink:#1c2b28;
    --paper:#f5f2e9;
    --well:#254a44;
    --well-deep:#16302c;
    --copper:#b5652e;
    --copper-2:#8f4c1f;
    --warn:#a13d2b;
    --good:#3d7a5c;
    --line: rgba(28,43,40,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, Roboto, 'Segoe UI', system-ui, sans-serif;
    font-size:18px;
    line-height:1.5;
    min-height:100vh;
    padding-bottom:24px;
  }
  .wrap{max-width:600px;margin:0 auto;padding:0 18px;}

  header{
    background:var(--well-deep);
    color:#fff;
    padding:20px 18px;
    display:flex; align-items:center; gap:12px;
  }
  header img{width:44px;height:44px;border-radius:10px;}
  header .htext{flex:1;}
  header h1{font-size:22px; margin:0; font-weight:800;}
  header .sub{font-size:14px; color:#b9d0c8; margin:2px 0 0;}
  header .grp-btn{
    background:rgba(255,255,255,0.14); border:none; color:#fff;
    font-size:14px; padding:10px 12px; border-radius:8px; cursor:pointer;
  }

  main{padding:20px 0 60px;}

  .big-btn{
    display:block; width:100%;
    background:#fff; border:2px solid var(--line);
    border-radius:16px; padding:20px 18px; margin-bottom:14px;
    text-align:left; cursor:pointer;
    font-size:20px; font-weight:700; color:var(--ink);
    display:flex; align-items:center; gap:16px;
  }
  .big-btn .icon{
    width:52px; height:52px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:26px;
  }
  .big-btn .icon.copper{background:#f0dcc5; }
  .big-btn .icon.well{background:#dbe8e3;}
  .big-btn .sub{font-size:14px; font-weight:400; color:#5a6b66; margin-top:2px;}
  .big-btn:active{transform:scale(0.98);}

  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:none; border:none; color:var(--well);
    font-size:17px; font-weight:700; padding:6px 0 18px; cursor:pointer;
  }

  .card{
    background:#fff; border:2px solid var(--line); border-radius:16px;
    padding:20px; margin-bottom:18px;
  }
  .card h2{font-size:20px; margin:0 0 16px; font-weight:800;}

  label{display:block; font-size:16px; font-weight:700; margin-bottom:8px; color:var(--well-deep);}
  input[type=text], input[type=number]{
    width:100%; font-size:22px; padding:16px 14px;
    border:2px solid var(--line); border-radius:12px; background:#fff; color:var(--ink);
    -webkit-appearance:none;
  }
  input:focus{outline:3px solid var(--well); outline-offset:1px;}
  .field{margin-bottom:18px;}

  button.action{
    width:100%; font-size:20px; font-weight:800;
    border:none; border-radius:14px; padding:18px 16px; cursor:pointer;
  }
  button.action.primary{background:var(--well); color:#fff;}
  button.action.copper{background:var(--copper); color:#fff;}
  button.action.ghost{background:#eee6d6; color:var(--ink);}
  button:active{transform:scale(0.98);}
  button:disabled{opacity:0.5;}

  .choice-row{display:flex; gap:12px; margin-bottom:18px;}
  .choice-btn{
    flex:1; padding:16px 10px; border-radius:12px; border:2px solid var(--line);
    background:#fff; font-size:16px; font-weight:700; text-align:center; cursor:pointer;
  }
  .choice-btn.active{background:var(--well); border-color:var(--well); color:#fff;}
  .choice-help{font-size:14px; color:#5a6b66; margin:-10px 0 18px;}

  .person-card{
    background:#fbf8f0; border:2px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-bottom:12px;
  }
  .person-card .pname{font-size:19px; font-weight:800; margin:0 0 4px;}
  .person-card .pkw{font-size:15px; color:#5a6b66;}
  .person-card .ptutar{
    font-size:30px; font-weight:900; color:var(--copper-2); margin-top:8px;
  }
  .person-card .ptutar .lbl{font-size:14px; font-weight:600; color:#5a6b66; display:block; margin-bottom:2px;}

  .period-item{
    background:#fff; border:2px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-bottom:12px; cursor:pointer;
  }
  .period-item .pdate{font-size:15px; color:#5a6b66; margin-bottom:4px;}
  .period-item .ptotal{font-size:22px; font-weight:800; color:var(--well-deep);}

  .empty{
    text-align:center; padding:40px 16px; color:#7a877f; font-size:17px;
  }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--well-deep); color:#fff; padding:14px 22px; border-radius:12px;
    font-size:16px; font-weight:700; z-index:50; opacity:0; pointer-events:none; transition:opacity 0.25s;
    max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1;}

  .setup-screen{padding:50px 18px; text-align:center;}
  .setup-screen h2{font-size:26px; margin-bottom:10px;}
  .setup-screen p{color:#5a6b66; font-size:17px; line-height:1.6; margin-bottom:24px;}

  .alert-box{
    background:#f6e8d8; border:2px solid #dcb98a; border-radius:12px;
    padding:14px 16px; font-size:15px; margin-bottom:16px; color:#6b4423;
  }

  .entry-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-bottom:1px solid var(--line);
    font-size:15px;
  }
  .entry-row:last-child{border-bottom:none;}
  .entry-row .ename{font-weight:800; font-size:16px;}
  .entry-row .edate{color:#7a877f; font-size:13px; margin-top:2px;}
  .entry-row .ediff{font-weight:800; color:var(--copper-2); font-size:17px; white-space:nowrap; margin-left:10px;}

  .grand-total{
    background:var(--well-deep); color:#fff; border-radius:14px;
    padding:18px; text-align:center; margin-top:6px;
  }
  .grand-total .lbl{font-size:14px; color:#b9d0c8; margin-bottom:4px;}
  .grand-total .amt{font-size:26px; font-weight:900;}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <img src="icon-192.png" alt="FlowLedger">
    <div class="htext">
      <h1>FlowLedger</h1>
      <p class="sub">Grup: <b id="groupLabel">—</b></p>
    </div>
    <button class="grp-btn" onclick="changeGroup()">Değiştir</button>
  </header>

  <main id="mainArea">
    <div class="empty">Yükleniyor…</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ---- Supabase config ----
const SUPABASE_URL = "https://cgacictzeziolwaalpyx.supabase.co";
const SUPABASE_KEY = "sb_publishable_0xSNpARCfpE9WbKve8ocWQ_vaH0J_1e";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let kuyuKodu = localStorage.getItem('flowledger_kuyu_kodu') || '';
let cache = { okumalar: [], donemler: [] };
let billMethod = 'oransal';
// tracks what's on screen so background refresh doesn't yank the user away.
// screens: 'home' | 'gecmis' | { name:'sonuc', arg:<periodIndex> } | 'giris' | 'fatura' (last two: paused, no auto-redraw)
let currentScreen = 'home';
let isSavingReading = false;
let isSavingBill = false;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function money(n){
  return n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' TL';
}
function formatDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('tr-TR', {day:'2-digit', month:'short'}) + ' · ' +
         d.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
}
// Groups people correctly even if the name was typed with different
// capitalization or stray spaces across entries (e.g. "ahmet " vs "Ahmet").
function nameKey(name){
  return name.trim().replace(/\s+/g, ' ').toLocaleLowerCase('tr-TR');
}
function displayName(name){
  return name.trim().replace(/\s+/g, ' ')
    .toLocaleLowerCase('tr-TR')
    .split(' ')
    .map(w => w ? w.charAt(0).toLocaleUpperCase('tr-TR') + w.slice(1) : w)
    .join(' ');
}

function changeGroup(){
  const val = prompt('Grup kodu girin (paylaştığın kişilerle aynı kodu kullan):', kuyuKodu || '');
  if(val && val.trim()){
    kuyuKodu = val.trim();
    localStorage.setItem('flowledger_kuyu_kodu', kuyuKodu);
    document.getElementById('groupLabel').textContent = kuyuKodu;
    loadAll();
  }
}

async function loadAll(isBackgroundRefresh){
  if(!kuyuKodu){ renderSetup(); return; }
  document.getElementById('groupLabel').textContent = kuyuKodu;
  // While the user is filling out a form, don't touch the screen at all —
  // just skip redrawing (data will still be fresh next time they navigate).
  if(isBackgroundRefresh && (currentScreen === 'giris' || currentScreen === 'fatura')){
    return;
  }
  try{
    const [okumalarRes, donemlerRes] = await Promise.all([
      sb.from('okumalar').select('*').eq('kuyu_kodu', kuyuKodu).order('created_at', {ascending:true}),
      sb.from('donemler').select('*').eq('kuyu_kodu', kuyuKodu).order('created_at', {ascending:true})
    ]);
    if(okumalarRes.error) throw okumalarRes.error;
    if(donemlerRes.error) throw donemlerRes.error;
    cache.okumalar = okumalarRes.data || [];
    cache.donemler = donemlerRes.data || [];
    redrawCurrentScreen();
  }catch(e){
    if(!isBackgroundRefresh){
      document.getElementById('mainArea').innerHTML = `<div class="empty">Veriler yüklenemedi.<br>İnterneti kontrol et.</div>`;
    }
    // on a background refresh failure, just leave the current screen as-is
  }
}

function redrawCurrentScreen(){
  if(currentScreen === 'home') renderHome();
  else if(currentScreen === 'gecmis') renderGecmis();
  else if(currentScreen && currentScreen.name === 'sonuc') renderSonuc(currentScreen.arg);
  // 'giris' / 'fatura' are intentionally left alone (see loadAll)
}

function renderSetup(){
  document.getElementById('groupLabel').textContent = '—';
  document.getElementById('mainArea').innerHTML = `
    <div class="setup-screen">
      <h2>Hoş geldin</h2>
      <p>Ortak kuyu kullanımını kolayca paylaştırmak için önce bir grup kodu belirle.<br>Bu kodu, birlikte kullandığın diğer kişilere de söyleyeceksin.</p>
      <div class="field" style="text-align:left;">
        <label for="setupCode">Grup Kodu</label>
        <input type="text" id="setupCode" placeholder="örn. sungu-kuyu">
      </div>
      <button class="action primary" onclick="setupGroup()">Devam Et</button>
    </div>
  `;
}
function setupGroup(){
  const val = document.getElementById('setupCode').value.trim();
  if(!val){ toast('Bir grup kodu gir'); return; }
  kuyuKodu = val;
  localStorage.setItem('flowledger_kuyu_kodu', kuyuKodu);
  loadAll();
}

// ---- Period computation ----
function computePeriods(){
  const donemler = cache.donemler;
  const okumalar = cache.okumalar;
  const periods = [];
  let cursor = null;
  donemler.forEach((d, idx) => {
    const readings = okumalar.filter(o => (cursor === null || o.created_at > cursor) && o.created_at <= d.created_at);
    periods.push({ donem: d, readings, closed: true, index: idx+1 });
    cursor = d.created_at;
  });
  const openReadings = okumalar.filter(o => cursor === null || o.created_at > cursor);
  periods.push({ donem: null, readings: openReadings, closed: false, index: donemler.length+1 });
  return periods;
}
function groupByPerson(readings){
  const map = {};
  readings.forEach(r => {
    const key = nameKey(r.kisi_adi);
    if(!map[key]) map[key] = { name: displayName(r.kisi_adi), total: 0, count: 0 };
    map[key].total += (r.kapatma_kw - r.acma_kw);
    map[key].count += 1;
  });
  return Object.values(map);
}
function calcPeriodResult(period){
  const groups = groupByPerson(period.readings);
  const kayitliToplam = groups.reduce((s,g)=>s+g.total,0);
  let fark = 0;
  const billKw = period.donem ? period.donem.fatura_toplam_kw : null;
  if(billKw != null && kayitliToplam > 0) fark = billKw - kayitliToplam;

  let rows = groups.map(g => ({ name: g.name, orijinal: g.total }));
  const method = period.donem ? period.donem.dagitim_yontemi : 'oransal';
  if(fark !== 0 && billKw != null){
    if(method === 'esit'){
      const pay = fark / (rows.length || 1);
      rows = rows.map(r => ({...r, farkPayi: pay, yeniToplam: r.orijinal + pay}));
    } else {
      rows = rows.map(r => ({...r, farkPayi: kayitliToplam>0 ? fark*(r.orijinal/kayitliToplam) : 0}));
      rows = rows.map(r => ({...r, yeniToplam: r.orijinal + r.farkPayi}));
    }
  } else {
    rows = rows.map(r => ({...r, farkPayi:0, yeniToplam:r.orijinal}));
  }
  const nihaiToplam = rows.reduce((s,r)=>s+r.yeniToplam,0);
  rows = rows.map(r => ({...r, oran: nihaiToplam>0 ? (r.yeniToplam/nihaiToplam)*100 : 0}));
  if(period.donem){
    rows = rows.map(r => ({...r, tutar: period.donem.toplam_tutar * (r.oran/100)}));
  }
  return { rows, kayitliToplam, fark, nihaiToplam, showFark: fark !== 0 && billKw != null };
}

// ---- Screens ----
function renderHome(){
  currentScreen = 'home';
  const periods = computePeriods();
  const openPeriod = periods[periods.length-1];
  const hasHistory = periods.length > 1;

  document.getElementById('mainArea').innerHTML = `
    <button class="big-btn" onclick="renderGiris()">
      <div class="icon copper">✏️</div>
      <div>Okuma Ekle
        <div class="sub">Pompayı açtığında ve kapattığında değerleri gir</div>
      </div>
    </button>
    <button class="big-btn" onclick="renderFatura()">
      <div class="icon well">🧾</div>
      <div>Fatura Gir
        <div class="sub">${openPeriod.readings.length} okuma bekliyor · dönemi kapat</div>
      </div>
    </button>
    <button class="big-btn" onclick="renderGecmis()">
      <div class="icon well">📋</div>
      <div>Geçmiş Faturalar
        <div class="sub">${hasHistory ? (periods.length-1) + ' kapanmış dönem' : 'Henüz kapanmış dönem yok'}</div>
      </div>
    </button>
  `;
}

function renderGiris(){
  currentScreen = 'giris';
  const periods = computePeriods();
  const openReadings = periods[periods.length-1].readings.slice().reverse();

  document.getElementById('mainArea').innerHTML = `
    <button class="back-btn" onclick="renderHome()">‹ Ana Menü</button>
    <div class="card">
      <h2>Okuma Ekle</h2>
      <div class="field">
        <label for="pname">Adın</label>
        <input type="text" id="pname" placeholder="örn. Ahmet">
      </div>
      <div class="field">
        <label for="pacma">Açma Değeri (kW)</label>
        <input type="number" id="pacma" inputmode="decimal" placeholder="örn. 2302">
      </div>
      <div class="field">
        <label for="pkapatma">Kapatma Değeri (kW)</label>
        <input type="number" id="pkapatma" inputmode="decimal" placeholder="örn. 2883">
      </div>
      <button class="action copper" id="saveReadingBtn" onclick="addReading()">Kaydet</button>
    </div>
    <div class="card">
      <h2>Bu Döneme Ait Kayıtlar (${openReadings.length})</h2>
      ${openReadings.length === 0 ? '<div class="empty">Henüz kayıt yok.</div>' : openReadings.map(r => `
        <div class="entry-row">
          <div>
            <div class="ename">${escapeHtml(displayName(r.kisi_adi))}</div>
            <div class="edate">${formatDateTime(r.created_at)} · ${r.acma_kw} → ${r.kapatma_kw}</div>
          </div>
          <div class="ediff">${(r.kapatma_kw - r.acma_kw).toFixed(1)} kW</div>
        </div>
      `).join('')}
    </div>
  `;
}

async function addReading(){
  if(isSavingReading) return; // ignore double-taps while a save is already in flight
  const name = document.getElementById('pname').value.trim().replace(/\s+/g, ' ');
  const acma = parseFloat(document.getElementById('pacma').value);
  const kapatma = parseFloat(document.getElementById('pkapatma').value);
  if(!name){ toast('Adını gir'); return; }
  if(isNaN(acma) || isNaN(kapatma)){ toast('Açma ve kapatma değerlerini gir'); return; }
  if(kapatma < acma){ toast('Kapatma değeri, açmadan küçük olamaz'); return; }

  isSavingReading = true;
  const btn = document.getElementById('saveReadingBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Kaydediliyor…'; }
  try{
    const { error } = await sb.from('okumalar').insert({
      kuyu_kodu: kuyuKodu, kisi_adi: name, acma_kw: acma, kapatma_kw: kapatma
    });
    if(error) throw error;
    toast('✓ Kaydedildi');
    await loadAll();
    renderGiris();
  }catch(e){
    toast('Hata oldu, tekrar dene');
  }finally{
    isSavingReading = false;
  }
}

function renderFatura(){
  currentScreen = 'fatura';
  const periods = computePeriods();
  const openPeriod = periods[periods.length-1];
  const result = calcPeriodResult(openPeriod);

  if(openPeriod.readings.length === 0){
    document.getElementById('mainArea').innerHTML = `
      <button class="back-btn" onclick="renderHome()">‹ Ana Menü</button>
      <div class="card">
        <h2>Fatura Gir</h2>
        <div class="empty">Bu dönemde henüz hiç okuma girilmedi.<br>Önce "Okuma Ekle" ile en az bir kayıt gir.</div>
      </div>
    `;
    return;
  }

  billMethod = 'oransal';
  document.getElementById('mainArea').innerHTML = `
    <button class="back-btn" onclick="renderHome()">‹ Ana Menü</button>
    <div class="card">
      <h2>Fatura Gir</h2>
      <p style="font-size:15px; color:#5a6b66; margin:0 0 16px;">Şu ana kadarki kayıtlı kullanım: <b style="color:var(--copper-2)">${result.kayitliToplam.toFixed(1)} kW</b></p>
      <div class="field">
        <label for="billTotal">Fatura Tutarı (TL)</label>
        <input type="number" id="billTotal" inputmode="decimal" placeholder="örn. 19060">
      </div>
      <div class="field">
        <label for="billKw">Faturadaki Toplam kW (biliyorsan)</label>
        <input type="number" id="billKw" inputmode="decimal" placeholder="boş bırakabilirsin">
      </div>
      <label>Fark Çıkarsa Nasıl Paylaştırılsın?</label>
      <div class="choice-row">
        <div class="choice-btn active" id="mOransal" onclick="setBillMethod('oransal')">Kullanıma Göre</div>
        <div class="choice-btn" id="mEsit" onclick="setBillMethod('esit')">Eşit Paylaş</div>
      </div>
      <div class="choice-help">"Kullanıma göre": çok kullanan farktan da çok pay alır. "Eşit paylaş": fark herkese eşit bölünür.</div>
      <button class="action primary" id="saveBillBtn" onclick="submitBill()">Dönemi Kapat</button>
    </div>
  `;
}
function setBillMethod(m){
  billMethod = m;
  document.getElementById('mOransal').classList.toggle('active', m==='oransal');
  document.getElementById('mEsit').classList.toggle('active', m==='esit');
}
async function submitBill(){
  if(isSavingBill) return;
  const total = parseFloat(document.getElementById('billTotal').value);
  const kwRaw = document.getElementById('billKw').value;
  if(isNaN(total) || total <= 0){ toast('Fatura tutarını gir'); return; }
  const billKw = kwRaw === '' ? null : parseFloat(kwRaw);
  if(!confirm(`${money(total)} tutarında bu dönem kapatılsın mı?\n\nBu işlem geri alınamaz.`)) return;

  isSavingBill = true;
  const btn = document.getElementById('saveBillBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Kaydediliyor…'; }
  try{
    const { error } = await sb.from('donemler').insert({
      kuyu_kodu: kuyuKodu, toplam_tutar: total, fatura_toplam_kw: billKw, dagitim_yontemi: billMethod
    });
    if(error) throw error;
    toast('✓ Dönem kapatıldı');
    await loadAll();
    renderSonuc(computePeriods().filter(p=>p.closed).length - 1);
  }catch(e){
    toast('Hata oldu, tekrar dene');
  }finally{
    isSavingBill = false;
  }
}

function renderGecmis(){
  currentScreen = 'gecmis';
  const periods = computePeriods().filter(p => p.closed).reverse();
  if(periods.length === 0){
    document.getElementById('mainArea').innerHTML = `
      <button class="back-btn" onclick="renderHome()">‹ Ana Menü</button>
      <div class="empty">Henüz kapanmış bir fatura dönemi yok.</div>
    `;
    return;
  }
  document.getElementById('mainArea').innerHTML = `
    <button class="back-btn" onclick="renderHome()">‹ Ana Menü</button>
    ${periods.map(p => {
      const date = new Date(p.donem.created_at).toLocaleDateString('tr-TR', {day:'2-digit', month:'long', year:'numeric'});
      return `
        <div class="period-item" onclick="renderSonuc(${p.index-1})">
          <div class="pdate">${date}</div>
          <div class="ptotal">${money(p.donem.toplam_tutar)}</div>
        </div>
      `;
    }).join('')}
  `;
}

function renderSonuc(periodIndexZeroBased){
  currentScreen = { name: 'sonuc', arg: periodIndexZeroBased };
  const periods = computePeriods();
  const period = periods[periodIndexZeroBased];
  const result = calcPeriodResult(period);
  const date = period.donem ? new Date(period.donem.created_at).toLocaleDateString('tr-TR', {day:'2-digit', month:'long', year:'numeric'}) : null;

  let farkHtml = '';
  if(result.showFark){
    farkHtml = `<div class="alert-box">Kayıtlı toplam ${result.kayitliToplam.toFixed(1)} kW idi, faturada ${period.donem.fatura_toplam_kw} kW görünüyor. ${result.fark>0?'+':''}${result.fark.toFixed(1)} kW fark, seçilen yönteme göre paylaştırıldı.</div>`;
  }

  const grandTotal = result.rows.reduce((s,r)=>s+(r.tutar||0),0);

  document.getElementById('mainArea').innerHTML = `
    <button class="back-btn" onclick="renderGecmis()">‹ Geçmiş</button>
    <div class="card">
      <h2>${date ? date + ' Faturası' : 'Bu Dönem'}</h2>
      ${farkHtml}
      ${result.rows.length === 0 ? '<div class="empty">Bu dönemde kayıt yok.</div>' : result.rows.map(r => `
        <div class="person-card">
          <p class="pname">${escapeHtml(r.name)}</p>
          <p class="pkw">${r.yeniToplam.toFixed(1)} kW kullandı · %${r.oran.toFixed(0)} pay</p>
          ${r.tutar !== undefined ? `
            <div class="ptutar"><span class="lbl">Ödeyecek</span>${money(r.tutar)}</div>
          ` : ''}
        </div>
      `).join('')}
      ${period.donem ? `
        <div class="grand-total">
          <div class="lbl">Toplam Fatura</div>
          <div class="amt">${money(period.donem.toplam_tutar)}</div>
        </div>
      ` : ''}
    </div>
  `;
}

// init
loadAll();
setInterval(() => loadAll(true), 15000);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
